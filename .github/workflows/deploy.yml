name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-12)
          IMAGE="${REGISTRY}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}"          >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE}:${SHORT}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHORT}"        >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: DEPLOY_IMAGE
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/ahaic-partner-portal

            # Log in to GHCR from the EC2 host (uses a PAT with read:packages)
            echo "${{ secrets.GHCR_READ_TOKEN }}" \
              | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            # Point the compose stack at the new image and roll it out
            export IMAGE="${{ needs.build.outputs.image_ref }}"
            grep -q '^IMAGE=' .env && sed -i "s|^IMAGE=.*|IMAGE=${IMAGE}|" .env \
                                   || echo "IMAGE=${IMAGE}" >> .env

            docker compose --env-file .env -f docker-compose.prod.yml pull
            docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans

            # Wait for the new app container to pass its health check
            for i in $(seq 1 30); do
                status=$(docker inspect --format '{{ '{{' }}.State.Health.Status{{ '}}' }}' \
                         "$(docker compose -f docker-compose.prod.yml ps -q app)" 2>/dev/null || echo starting)
                [ "$status" = "healthy" ] && echo "app is healthy" && break
                sleep 5
            done

            docker image prune -f
