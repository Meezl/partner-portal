# EC2 host compose file. Pulls the image built by GitHub Actions from GHCR
# and fronts it with Caddy (automatic Let's Encrypt TLS).
#
# Required env vars (put them in /opt/ahaic-partner-portal/.env on the host):
#   IMAGE                 e.g. ghcr.io/your-org/ahaic-partner-portal:latest
#   APP_DOMAIN            e.g. portal.example.com
#   APP_KEY               `base64:...` from `php artisan key:generate --show`
#   DB_HOST / DB_PORT / DB_DATABASE / DB_USERNAME / DB_PASSWORD
#   REDIS_HOST / REDIS_PORT
#   AWS_* / MAIL_* / any other Laravel env

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: "https://${APP_DOMAIN}"
  ASSET_URL: "https://${APP_DOMAIN}"
  APP_KEY: "${APP_KEY}"

  LOG_CHANNEL: stderr
  LOG_LEVEL: info

  DB_CONNECTION: mysql
  DB_HOST: "${DB_HOST}"
  DB_PORT: "${DB_PORT:-3306}"
  DB_DATABASE: "${DB_DATABASE}"
  DB_USERNAME: "${DB_USERNAME}"
  DB_PASSWORD: "${DB_PASSWORD}"

  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_HOST: "${REDIS_HOST}"
  REDIS_PORT: "${REDIS_PORT:-6379}"

  FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
  AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-eu-west-1}"
  AWS_BUCKET: "${AWS_BUCKET:-}"

  MAIL_MAILER: "${MAIL_MAILER:-log}"
  MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-no-reply@example.com}"
  MAIL_FROM_NAME: "AHAIC Partner Portal"

services:
  # One-shot migration task. Not started by `docker compose up` (it sits in the
  # `migrate` profile), so scaling `app` can never trigger concurrent
  # migrations. Run it deliberately, before bringing the app up:
  #
  #   docker compose -f docker-compose.prod.yml run --rm migrate
  #
  migrate:
    image: ${IMAGE}
    profiles: ["migrate"]
    restart: "no"
    command: ["migrate"]
    environment:
      <<: *app-env
    volumes:
      - ./data/storage:/var/www/html/storage
    depends_on: [redis]
    networks: [back]

  app:
    image: ${IMAGE}
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - ./data/storage:/var/www/html/storage
    depends_on: [redis]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [edge, back]

  queue:
    image: ${IMAGE}
    restart: unless-stopped
    command: ["queue"]
    environment:
      <<: *app-env
    volumes:
      - ./data/storage:/var/www/html/storage
    depends_on: [redis, app]
    networks: [back]

  scheduler:
    image: ${IMAGE}
    restart: unless-stopped
    command: ["scheduler"]
    environment:
      <<: *app-env
    volumes:
      - ./data/storage:/var/www/html/storage
    depends_on: [redis, app]
    networks: [back]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes: [./data/redis:/data]
    networks: [back]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: "${APP_DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on: [app]
    networks: [edge]

networks:
  edge:
  back:
