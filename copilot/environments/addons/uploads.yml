Parameters:
  App:
    Type: String
    Description: Your application's name.
  Env:
    Type: String
    Description: The name of the environment being deployed.

Resources:
  uploadsBucket:
    Metadata:
      'aws:copilot:description': 'An Amazon S3 bucket, uploads, for storing and retrieving objects'
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  uploadsBucketPolicy:
    Metadata:
      'aws:copilot:description': 'A bucket policy to deny unencrypted access to the bucket and its contents'
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    Properties:
      Bucket: !Ref uploadsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ForceHTTPS
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub ${uploadsBucket.Arn}/*
              - !Sub ${uploadsBucket.Arn}
            Condition:
              Bool:
                "aws:SecureTransport": false

Outputs:
  uploadsName:
    Description: "The name of the uploads bucket."
    Value: !Ref uploadsBucket
    Export:
      Name: !Sub ${App}-${Env}-uploadsBucketName
  uploadsBucketARN:
    Description: "The ARN of the uploads bucket."
    Value: !GetAtt uploadsBucket.Arn
    Export:
      Name: !Sub ${App}-${Env}-uploadsBucketARN
